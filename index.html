
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office Desk Aquarium</title>

<style>
:root {
  --glass: rgba(218,250,255,.72);
  --wood: #8c5736;
  --deep: #102c35;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 18px;
  font-family: Arial, Helvetica, sans-serif;
  color: #f7fff9;
  background: radial-gradient(
    ellipse at 50% 0%,
    #446e65 0%,
    #203e36 48%,
    #10241e 100%
  );
}

.office {
  position: relative;
  width: min(100%, 900px);
  height: 600px;
  overflow: hidden;
  border-radius: 22px;
  background:
    linear-gradient(
      90deg,
      transparent 0 67%,
      rgba(255,205,117,.12) 67%
    ),
    linear-gradient(
      #d7e9e2 0 70%,
      #bd895c 70% 100%
    );
  box-shadow:
    0 28px 70px #0008,
    inset 0 0 0 1px #ffffff55;
  isolation: isolate;
}

.wall-glow {
  position: absolute;
  inset: 0 0 30% 0;
  background: radial-gradient(
    ellipse at 62% 50%,
    #fff9d7aa,
    transparent 48%
  );
  pointer-events: none;
}

/* Window */

.window {
  position: absolute;
  left: 3.5%;
  top: 6%;
  width: 34%;
  height: 38%;
  border: 10px solid #765039;
  border-bottom-width: 13px;
  background: linear-gradient(
    135deg,
    #a8d8e7,
    #e5f2d9 52%,
    #83bca0
  );
  box-shadow:
    inset 0 0 20px #fff9,
    0 6px 12px #3d4e4433;
}

.window::before {
  content: "";
  position: absolute;
  left: 49%;
  top: 0;
  bottom: 0;
  width: 7px;
  background: #765039;
}

.window::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 54%;
  height: 7px;
  background: #765039;
}

.skyline {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 42%;
  opacity: .32;
  background: linear-gradient(
    90deg,
    transparent 2%,
    #789b98 2% 8%,
    transparent 8% 12%,
    #789b98 12% 21%,
    transparent 21% 28%,
    #789b98 28% 35%,
    transparent 35% 43%,
    #789b98 43% 50%,
    transparent 50%
  );
}

/* Title plaque */

.title-plaque {
  position: absolute;
  top: 4%;
  left: 40%;
  width: 43%;
  padding: 13px 12px;
  text-align: center;
  color: #f9e9c9;
  font-size: clamp(15px, 2.2vw, 23px);
  font-weight: 700;
  letter-spacing: 1.5px;
  background: linear-gradient(#5a3826, #2e211b);
  border: 2px solid #a67a4c;
  border-radius: 8px;
  box-shadow: 0 7px 12px #4b3a2b44;
  text-shadow: 0 2px 3px #0008;
}

/* Notice board */

.pinboard {
  position: absolute;
  right: 2%;
  top: 0;
  width: 20%;
  height: 25%;
  background: #9d704d;
  border: 9px solid #6c482f;
  box-shadow: 0 5px 12px #0002;
}

.note {
  position: absolute;
  top: 20%;
  left: 17%;
  width: 65%;
  padding: 10px 5px;
  text-align: center;
  background: #f5d97e;
  color: #453b22;
  font-size: 12px;
  line-height: 1.4;
  transform: rotate(-3deg);
  box-shadow: 0 4px 8px #0002;
}

/* Desk lamp */

.lamp {
  position: absolute;
  right: 5%;
  top: 0;
  width: 100px;
  height: 100px;
}

.lamp::before {
  content: "";
  position: absolute;
  top: -10px;
  left: 48px;
  width: 7px;
  height: 72px;
  background: #343d3a;
  transform: rotate(12deg);
  transform-origin: top;
}

.lamp::after {
  content: "";
  position: absolute;
  top: 50px;
  left: 8px;
  width: 92px;
  height: 34px;
  border-radius: 8px 8px 50% 50%;
  background: linear-gradient(#3d4844, #151d1b);
  box-shadow: 0 9px 22px #ffe6a966;
}

/* Wooden desk */

.desk {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 24%;
  background: linear-gradient(
    180deg,
    #d5a16d,
    #9d633e 12%,
    #75452d 100%
  );
  box-shadow: inset 0 7px 8px #f6d0a244;
}

.desk::before {
  content: "";
  position: absolute;
  top: 8px;
  left: 0;
  right: 0;
  height: 3px;
  background: #f1c18b88;
}

/* Aquarium */

.aquarium {
  position: absolute;
  z-index: 3;
  left: 25%;
  top: 27%;
  width: 51%;
  height: 43%;
  border: 8px solid #e4fbff;
  border-top-width: 7px;
  border-radius: 9px 9px 13px 13px;
  background: linear-gradient(
    180deg,
    #83d9e9cc 0%,
    #2c9bb4ee 42%,
    #11627b 100%
  );
  box-shadow:
    0 13px 25px #1c394b45,
    inset 0 0 18px #fff9,
    inset 10px 0 12px #d8ffff55,
    inset -10px 0 12px #092d4d55;
  overflow: hidden;
}

.aquarium::before {
  content: "";
  position: absolute;
  z-index: 5;
  left: 0;
  right: 0;
  top: 0;
  height: 8px;
  background: #f8ffffbb;
  box-shadow: 0 0 13px #fff;
}

.aquarium::after {
  content: "";
  position: absolute;
  z-index: 4;
  top: 0;
  left: 8%;
  width: 20%;
  height: 100%;
  background: linear-gradient(90deg, #fff5, transparent);
  transform: skewX(-12deg);
  pointer-events: none;
}

.lightbar {
  position: absolute;
  z-index: 4;
  left: 26%;
  top: 24%;
  width: 49%;
  height: 12px;
  border-radius: 10px;
  background: linear-gradient(#faffff, #75dffb);
  box-shadow:
    0 0 18px #b7f5ff,
    0 0 35px #4ed5ff88;
}

.waterline {
  position: absolute;
  top: 8px;
  left: 0;
  right: 0;
  height: 3px;
  background: #eaffffbb;
  animation: ripple 3s ease-in-out infinite alternate;
}

.gravel {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 14%;
  background:
    radial-gradient(ellipse at 10% 30%, #f3d49b 0 3px, transparent 4px),
    radial-gradient(ellipse at 20% 70%, #5c4d42 0 4px, transparent 5px),
    radial-gradient(ellipse at 38% 30%, #e9d5b0 0 4px, transparent 5px),
    radial-gradient(ellipse at 57% 65%, #85735c 0 4px, transparent 5px),
    radial-gradient(ellipse at 75% 30%, #ead3a5 0 3px, transparent 4px),
    radial-gradient(ellipse at 90% 70%, #5a4c43 0 4px, transparent 5px),
    linear-gradient(#d0b58b, #8c765b);
}

/* Aquarium rocks */

.rock {
  position: absolute;
  bottom: 9%;
  width: 18%;
  height: 18%;
  background: linear-gradient(
    135deg,
    #75817a,
    #344b4b 60%,
    #1b3335
  );
  border-radius: 45% 55% 28% 35%;
  box-shadow:
    inset 5px 4px 7px #b9c4b555,
    0 4px 5px #10313b66;
}

.r1 {
  left: 14%;
  transform: rotate(-13deg);
}

.r2 {
  left: 25%;
  bottom: 10%;
  width: 12%;
  height: 13%;
  transform: rotate(12deg);
}

.r3 {
  right: 13%;
  width: 15%;
  height: 14%;
  transform: rotate(10deg);
}

/* Aquatic plants */

.aqua-plant {
  position: absolute;
  bottom: 11%;
  width: 5px;
  height: 38%;
  border-radius: 100% 0;
  background: linear-gradient(90deg, #2b754e, #9dd77b);
  transform-origin: bottom;
  box-shadow: 5px -15px 0 -1px #6fbd70;
}

.ap1 {
  left: 9%;
  transform: rotate(-19deg);
  height: 35%;
}

.ap2 {
  left: 13%;
  transform: rotate(16deg);
  height: 47%;
}

.ap3 {
  left: 18%;
  transform: rotate(-6deg);
  height: 30%;
}

.ap4 {
  right: 17%;
  transform: rotate(22deg);
  height: 41%;
}

.ap5 {
  right: 22%;
  transform: rotate(-17deg);
  height: 34%;
}

/* Swimming fish */

.fish {
  position: absolute;
  z-index: 2;
  width: 48px;
  height: 25px;
  border-radius: 55% 45% 48% 52%;
  background: var(--fish);
  filter: drop-shadow(0 2px 2px #16323b55);
  animation: swim var(--speed) ease-in-out infinite alternate;
}

.fish::before {
  content: "";
  position: absolute;
  right: -13px;
  top: 5px;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  border-left: 16px solid var(--fish);
}

.fish::after {
  content: "";
  position: absolute;
  left: 8px;
  top: 7px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #10242b;
  box-shadow: 1px 1px 0 #fff;
}

.f1 {
  --fish: #ff9e3d;
  --speed: 5s;
  top: 25%;
  left: 8%;
}

.f2 {
  --fish: #f6f0d8;
  --speed: 7s;
  --travel: -70px;
  top: 48%;
  left: 48%;
  transform: scale(.8);
}

.f3 {
  --fish: #f16d76;
  --speed: 6s;
  --travel: 90px;
  top: 66%;
  left: 24%;
  transform: scale(.9);
}

.f4 {
  --fish: #ffd85a;
  --speed: 8s;
  --travel: -55px;
  top: 36%;
  left: 65%;
  transform: scale(.65);
}

@keyframes swim {
  from {
    translate: 0 0;
  }
  to {
    translate: var(--travel, 110px) -12px;
  }
}

/* Rising bubbles */

.bubble {
  position: absolute;
  z-index: 2;
  bottom: 12%;
  width: 7px;
  height: 7px;
  border: 1px solid #e8ffff;
  border-radius: 50%;
  animation: rise 3s linear infinite;
  box-shadow: 0 0 5px #fff9;
}

.b1 {
  left: 42%;
}

.b2 {
  left: 53%;
  animation-delay: 1s;
  width: 5px;
  height: 5px;
}

.b3 {
  left: 64%;
  animation-delay: 1.8s;
}

.b4 {
  left: 74%;
  animation-delay: .5s;
  width: 4px;
  height: 4px;
}

@keyframes rise {
  from {
    transform: translateY(0);
    opacity: .9;
  }
  to {
    transform: translateY(-190px);
    opacity: 0;
  }
}

/* Bonsai plant */

.plant {
  position: absolute;
  z-index: 2;
  bottom: 23%;
  width: 100px;
  height: 160px;
}

.bonsai {
  left: 2%;
}

.trunk {
  position: absolute;
  bottom: 20px;
  left: 42px;
  width: 13px;
  height: 86px;
  background: linear-gradient(
    90deg,
    #50341f,
    #9b6840,
    #55351f
  );
  border-radius: 6px;
  transform: rotate(-8deg);
}

.branch {
  position: absolute;
  width: 8px;
  height: 48px;
  left: 39px;
  bottom: 73px;
  background: #765039;
  transform: rotate(-42deg);
  border-radius: 5px;
}

.crown {
  position: absolute;
  width: 65px;
  height: 48px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 30% 25%,
    #83b66b,
    #36764a 70%
  );
  box-shadow:
    18px 15px 0 -5px #2d633e,
    -14px 18px 0 -6px #477e4b;
}

.c1 {
  left: 3px;
  top: 28px;
}

.c2 {
  left: 35px;
  top: 7px;
}

.c3 {
  left: 28px;
  top: 43px;
}

.pot {
  position: absolute;
  bottom: 0;
  left: 19px;
  width: 66px;
  height: 38px;
  background: linear-gradient(
    90deg,
    #a65e3c,
    #d18a5d,
    #8d4c31
  );
  clip-path: polygon(0 0, 100% 0, 84% 100%, 16% 100%);
  box-shadow: 0 5px 6px #0003;
}

/* Spider plant */

.spider {
  right: 1%;
  height: 145px;
  width: 110px;
}

.spider .pot {
  left: 18px;
  width: 75px;
  height: 42px;
  background: linear-gradient(
    90deg,
    #c9bda4,
    #f1e7d0,
    #b7a88d
  );
}

.leaf {
  position: absolute;
  bottom: 35px;
  left: 53px;
  width: 12px;
  height: 100px;
  border-radius: 100% 0;
  background: linear-gradient(90deg, #3b8a4a, #c5df8a);
  transform-origin: bottom;
  animation: sway 2.5s ease-in-out infinite alternate;
}

.l2 {
  transform: rotate(-25deg);
  animation-delay: -.5s;
}

.l3 {
  transform: rotate(25deg);
  animation-delay: -1s;
}

.l4 {
  transform: rotate(-43deg);
  height: 82px;
  animation-delay: -.8s;
}

.l5 {
  transform: rotate(43deg);
  height: 82px;
  animation-delay: -.3s;
}

@keyframes sway {
  to {
    margin-left: 5px;
  }
}

/* Books and stationery */

.book-stack {
  position: absolute;
  z-index: 2;
  right: 2%;
  bottom: 24%;
  width: 95px;
  height: 65px;
}

.book {
  height: 19px;
  margin-top: 2px;
  border-radius: 2px;
  background: #273e43;
  border-bottom: 3px solid #182b2f;
  color: #e6d5b7;
  font-size: 10px;
  text-align: center;
  padding-top: 3px;
  letter-spacing: 1px;
}

.book:nth-child(2) {
  background: #8d4c39;
}

.book:nth-child(3) {
  background: #355b4b;
}

.pen-cup {
  position: absolute;
  z-index: 2;
  right: 14%;
  bottom: 24%;
  width: 36px;
  height: 48px;
  border-radius: 4px 4px 10px 10px;
  background: repeating-linear-gradient(
    90deg,
    #222a28,
    #222a28 4px,
    #4a514b 5px
  );
  border: 2px solid #7d827a;
}

.pen-cup::before {
  content: "";
  position: absolute;
  top: -22px;
  left: 7px;
  width: 4px;
  height: 25px;
  background: #f1bb48;
  box-shadow: 8px 4px #e56d52, 15px -2px #e8e0ca;
}

.laptop {
  position: absolute;
  right: -4%;
  bottom: 3%;
  width: 24%;
  height: 13%;
  background: linear-gradient(145deg, #b7c2c3, #667579);
  border-radius: 7px 7px 2px 2px;
  transform: skewY(-4deg);
  box-shadow: 0 7px 12px #0004;
}

.laptop::before {
  content: "";
  position: absolute;
  left: -8%;
  right: -4%;
  bottom: -8px;
  height: 9px;
  background: linear-gradient(#d3d8d5, #7c8886);
  border-radius: 2px 2px 8px 8px;
}

.pencil {
  position: absolute;
  left: 4%;
  bottom: 5%;
  width: 90px;
  height: 7px;
  border-radius: 4px;
  background: linear-gradient(#e4b84c, #9e692e);
  transform: rotate(-12deg);
  box-shadow: 0 2px 2px #0003;
}

/* Pause and play button */

.controls {
  position: absolute;
  z-index: 10;
  left: 50%;
  bottom: 4%;
  transform: translateX(-50%);
  display: flex;
  gap: 9px;
  align-items: center;
}

button {
  border: 1px solid #e9ffffaa;
  border-radius: 30px;
  padding: 12px 22px;
  background: linear-gradient(135deg, #147f77, #075b63);
  color: #fff;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 5px 14px #063c3c55;
  transition: transform .2s, filter .2s;
}

button:hover {
  filter: brightness(1.13);
  transform: translateY(-2px);
}

.paused * {
  animation-play-state: paused !important;
}

/* Mobile responsive design */

@media (max-width: 600px) {
  .office {
    height: 520px;
  }

  .window {
    left: 3%;
    width: 35%;
    height: 30%;
    border-width: 6px;
  }

  .title-plaque {
    left: 38%;
    width: 45%;
    top: 5%;
    font-size: 14px;
    padding: 10px 4px;
  }

  .pinboard {
    display: none;
  }

  .aquarium {
    left: 20%;
    top: 29%;
    width: 60%;
    height: 39%;
    border-width: 5px;
  }

  .lightbar {
    left: 21%;
    width: 58%;
    top: 26%;
  }

  .plant {
    transform: scale(.72);
    transform-origin: bottom;
  }

  .bonsai {
    left: -5%;
  }

  .spider {
    right: -7%;
  }

  .book-stack {
    right: 0;
    transform: scale(.7);
    transform-origin: bottom right;
  }

  .pen-cup {
    right: 12%;
  }

  .laptop {
    width: 22%;
  }

  .controls {
    bottom: 3%;
  }

  button {
    padding: 10px 16px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div class="office" id="office">

  <div class="wall-glow"></div>

  <div class="window">
    <div class="skyline"></div>
  </div>

  <div class="title-plaque">
    My Office Desk 🌿
  </div>

  <div class="pinboard">
    <div class="note">
      Small Steps<br>
      Big Dreams ✨
    </div>
  </div>

  <div class="lamp"></div>

  <!-- Bonsai plant -->

  <div class="plant bonsai">
    <div class="crown c1"></div>
    <div class="crown c2"></div>
    <div class="crown c3"></div>
    <div class="branch"></div>
    <div class="trunk"></div>
    <div class="pot"></div>
  </div>

  <!-- Spider plant -->

  <div class="plant spider">
    <i class="leaf"></i>
    <i class="leaf l2"></i>
    <i class="leaf l3"></i>
    <i class="leaf l4"></i>
    <i class="leaf l5"></i>
    <div class="pot"></div>
  </div>

  <!-- Aquarium light -->

  <div class="lightbar"></div>

  <!-- Fish tank -->

  <div class="aquarium">

    <div class="waterline"></div>

    <i class="aqua-plant ap1"></i>
    <i class="aqua-plant ap2"></i>
    <i class="aqua-plant ap3"></i>
    <i class="aqua-plant ap4"></i>
    <i class="aqua-plant ap5"></i>

    <div class="rock r1"></div>
    <div class="rock r2"></div>
    <div class="rock r3"></div>

    <div class="fish f1"></div>
    <div class="fish f2"></div>
    <div class="fish f3"></div>
    <div class="fish f4"></div>

    <i class="bubble b1"></i>
    <i class="bubble b2"></i>
    <i class="bubble b3"></i>
    <i class="bubble b4"></i>

    <div class="gravel"></div>

  </div>

  <!-- Books and stationery -->

  <div class="book-stack">
    <div class="book">WORK</div>
    <div class="book">PLAN</div>
    <div class="book">SUCCESS</div>
  </div>

  <div class="pen-cup"></div>

  <div class="desk"></div>

  <div class="pencil"></div>

  <div class="laptop"></div>

  <!-- Controls -->

  <div class="controls">
    <button id="toggleBtn" onclick="toggleAnimation()">
      ❚❚ Pause / Play
    </button>
  </div>

</div>

<script>
function toggleAnimation() {
  const office = document.getElementById("office");

  office.classList.toggle("paused");

  const paused = office.classList.contains("paused");

  document.getElementById("toggleBtn").textContent =
    paused
      ? "▶ Play Animation"
      : "❚❚ Pause / Play";
}
</script>

</body>
</html>
